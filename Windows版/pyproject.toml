[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ktp-downloader"
version = "0.1.0"
description = "课堂派资料/课件下载（个人学习备份）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.24.0",
    "requests>=2.28.0",
    "pycryptodome>=3.19.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ktp-downloader = "ktp_app.main:run_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"
